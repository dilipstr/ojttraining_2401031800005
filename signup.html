<div class="row w-100 justify-content-center align-items-center full-height">
        <div class="card col-sm-7 col-md-6 col-10 p-4 bg-mysecond rounded-5">            
            <h1 class="h1 fw-bold" style="text-decoration:underline wavy; text-underline-offset: 1rem;">Register</h1>
            <form action="/" method="get">
                <div class="mb-3 mt-3">
                    <label for="name" class="form-label text-secondary">Name</label>
                    <input type="text" name="name" id="name" placeholder="Enter Your Name:" class="form-control rounded-5">
                </div>
                <div class="mb-3 mt-3">
                    <label for="email" class="form-label text-secondary">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter Your Email:" class="form-control rounded-5">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary" for="password">Password</label>
                    <input class="form-control rounded-5" type="password" name="password" id="password" placeholder="Enter Your Password">
                </div>
                <div class="mb-3 mt-3">
                    <label for="confirm-password" class="form-label text-secondary">Repeat password</label>
                    <input type="confirm-password" name="email" id="confirm-password" placeholder="Repeat password" class="form-control rounded-5">
                </div>
                <div class="form-check mb-3 gap-2">
                    <input type="checkbox" name="remember" id="remember" class="form-check-input">
                    <label for="remember" class="form-check-label text-secondary">Remember Your Password</label>
                </div>
                <button class="btn btn-dark w-100 rounded-5 p-3 fw-bold ls-5 mb-2">REGISTER</button>
                <a href="login.html">
                    <button class="btn btn-light w-100 rounded-5 p-3 fw-bold ls-5" type="button">SIGN IN</button>
                </a>
            </form>
        </div>
    </div>
