<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Nature Care</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .success-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .success-card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 50px;
            color: white;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        .success-title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .success-subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .order-details {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
            text-decoration: none;
        }

        .btn-secondary-custom {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-secondary-custom:hover {
            background: #f0f3ff;
            text-decoration: none;
            color: #667eea;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary position-sticky sticky-top glass-box shadow">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="home.html">
                <i class="fa-solid fa-tree"></i>Nature Care
            </a>
            <button class="navbar-toggler rounded-5" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarTogglerDemo03" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fs-5">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            <h1 class="success-title">Order Confirmed!</h1>
            <p class="success-subtitle">Thank you for your purchase. We'll send you updates via email.</p>

            <div class="order-details">
                <div id="orderContent"></div>
            </div>

            <div style="margin-top: 30px;">
                <p style="color: #999; font-size: 0.9rem; margin-bottom: 20px;">
                    You will receive a confirmation email shortly with order details and tracking information.
                </p>
                <a href="products.html" class="btn btn-primary-custom">
                    <i class="fa-solid fa-shopping-bag"></i> Continue Shopping
                </a>
                <a href="home.html" class="btn btn-secondary-custom">
                    <i class="fa-solid fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2024 Nature Care. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const order = JSON.parse(localStorage.getItem('lastOrder'));
            const orderContent = document.getElementById('orderContent');

            if (order) {
                const itemsHTML = order.items.map(item => `
                    <div class="detail-row">
                        <span>${item.name} x${item.quantity}</span>
                        <span>$${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                `).join('');

                const subtotal = order.items.reduce((total, item) => total + (item.price * item.quantity), 0);
                const tax = subtotal * 0.1;
                const shipping = 10;
                const total = order.totalAmount;

                orderContent.innerHTML = `
                    ${itemsHTML}
                    <div class="detail-row" style="border-top: 2px solid #667eea; margin-top: 10px; padding-top: 10px; font-weight: 600;">
                        <span>Subtotal</span>
                        <span>$${subtotal.toFixed(2)}</span>
                    </div>
                    <div class="detail-row">
                        <span>Tax (10%)</span>
                        <span>$${tax.toFixed(2)}</span>
                    </div>
                    <div class="detail-row">
                        <span>Shipping</span>
                        <span>$${shipping.toFixed(2)}</span>
                    </div>
                    <div class="detail-row" style="border-top: 2px solid #667eea; margin-top: 10px; padding-top: 10px; font-weight: 700; font-size: 1.1rem; color: #667eea;">
                        <span>Total</span>
                        <span>$${total.toFixed(2)}</span>
                    </div>
                    <div class="detail-row">
                        <span>Payment Method</span>
                        <span style="text-transform: uppercase; font-weight: 600;">${order.paymentMethod}</span>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
